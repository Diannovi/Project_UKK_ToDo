<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PT Atlantik Internasional Akses — Dashboard</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="manager.css" />
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <!-- Simple SVG tower logo -->
        <div class="logo-wrap" aria-hidden="true">
          <svg width="44" height="44" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="28" y="6" width="8" height="52" rx="2" fill="#ffffff" opacity="0.95"/>
            <path d="M32 6L48 14L32 22L16 14L32 6Z" fill="#ffffff" opacity="0.95"/>
            <path d="M32 22V58" stroke="#cfe6ff" stroke-width="1.2"/>
            <path d="M22 18L42 26" stroke="#cfe6ff" stroke-width="1.2"/>
          </svg>
        </div>

        <div class="brand-text">
          <div class="company-name">PT ATLANTIK</div>
          <div class="company-sub">Internasional Akses</div>
        </div>
      </div>

      <nav id="menuList" class="menu"></nav>

      <div class="bottom-section">
        <button class="logout-btn" id="logoutBtn">⤶ Logout</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="header">
        <button id="toggleSidebar" class="toggle-btn" aria-label="Toggle sidebar">☰</button>
        <h1 id="pageTitle">Dashboard</h1>
      </header>

      <section class="content" id="content"></section>
    </main>
  </div>

  <script src="manager.js"></script>
</body>
</html>
