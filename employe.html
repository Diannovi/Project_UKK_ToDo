<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PT Atlantik Internasional Akses - Employee Dashboard</title>
  <link rel="stylesheet" href="employe.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>

  <!-- SIDEBAR -->
  <div class="sidebar">

    <div class="top-section">

        <!-- Simple SVG tower logo -->
        <div class="logo-wrap" aria-hidden="true">
          <svg width="44" height="44" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="28" y="6" width="8" height="52" rx="2" fill="#ffffff" opacity="0.95"/>
            <path d="M32 6L48 14L32 22L16 14L32 6Z" fill="#ffffff" opacity="0.95"/>
            <path d="M32 22V58" stroke="#cfe6ff" stroke-width="1.2"/>
            <path d="M22 18L42 26" stroke="#cfe6ff" stroke-width="1.2"/>
          </svg>
        </div>
      <h2>PT Atlantik Internasional Akses</h2>
    </div>

    <div class="menu">
      <div class="menu-item active" data-page="tasks">
        <i class="fa-solid fa-list-check"></i> My Tasks
      </div>
    </div>

    <!-- LOGOUT DI BAWAH -->
    <div class="logout-section">
      <button class="logout-btn" onclick="logout()">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </button>
    </div>

  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content">

    <!-- HEADER -->
    <div class="header">
      <h1><i class="fa-solid fa-clipboard-list"></i> My Tasks</h1>
      <div class="date-box" id="currentDate"></div>
    </div>

    <!-- TASK LIST -->
    <div id="contentArea">
      <div class="task-list" id="taskList"></div>
    </div>

  </div>

  <script src="employe.js"></script>
  <script>
    function showDate() {
      const date = new Date();
      const options = { weekday: "long", year: "numeric", month: "long", day: "numeric" };
      document.getElementById("currentDate").innerText = date.toLocaleDateString("id-ID", options);
    }
    showDate();
  </script>

</body>
</html>
